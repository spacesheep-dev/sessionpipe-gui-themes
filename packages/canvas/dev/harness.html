<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>canvas · harness</title>
<link rel="stylesheet" href="host.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
  #host { position: absolute; inset: 0; }
  #log {
    position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
    font: 11px/1 var(--font-mono); color: var(--fg-3); pointer-events: none; z-index: 10;
  }
  #log:empty { display: none; }
  /* A stand-in for the host's menu and action sheet: what the canvas asked for, clickable. */
  .hm { position: fixed; z-index: 60; min-width: 200px; padding: 4px; background: var(--bg-2);
    border: 1px solid var(--line); border-radius: var(--radius-pop); box-shadow: var(--shadow-pop);
    font-size: var(--text-sm); }
  .hm.is-sheet { right: 0; bottom: 0; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; }
  .hm-head { padding: 6px 8px; color: var(--fg-3); }
  .hm [role="menuitem"], .hm [role="menuitemradio"] { display: flex; gap: 8px; width: 100%; height: 26px; align-items: center;
    padding: 0 8px; border-radius: var(--radius-inner); text-align: left; }
  .hm.is-sheet [role="menuitem"], .hm.is-sheet [role="menuitemradio"] { height: 44px; }
  .hm [role^="menuitem"]:hover { background: var(--sel); }
  .hm [aria-disabled="true"] { color: var(--fg-4); }
  .hm .is-danger { color: var(--err); }
  .hm hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .hm-keys { margin-left: auto; color: var(--fg-3); }
</style>
<link rel="stylesheet" href="dist/harness.css">
</head>
<body>
<div id="host"></div>
<div id="log"></div>
<script type="module" src="dist/harness.js"></script>
</body>
</html>
