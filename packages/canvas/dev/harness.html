<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>canvas · harness</title>
<style>
  /* The host's tokens (sessionpipe-gui web/src/styles/tokens.css), the subset the theme uses,
     so the harness renders the way the real host does. */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --bg: oklch(0.985 0.004 85);
    --bg-2: oklch(0.998 0.002 85);
    --bg-3: oklch(0.955 0.006 85);
    --line: oklch(0.905 0.008 85);
    --line-2: oklch(0.84 0.01 85);
    --fg: oklch(0.22 0.014 265);
    --fg-2: oklch(0.44 0.016 265);
    --fg-3: oklch(0.58 0.014 265);
    --fg-4: oklch(0.7 0.01 265);
    --needs: oklch(0.72 0.15 65);
    --needs-bg: oklch(0.965 0.03 82);
    --state-working: oklch(0.6 0.11 200);
    --state-working-bg: oklch(0.955 0.025 200);
    --state-stale: oklch(0.6 0.05 280);
    --state-stale-bg: oklch(0.955 0.015 280);
    --state-idle: var(--fg-3);
    --state-done: var(--fg-4);
    --ok: oklch(0.6 0.1 150);
    --err: oklch(0.55 0.16 25);
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.165 0.008 255);
    --bg-2: oklch(0.195 0.009 255);
    --bg-3: oklch(0.225 0.01 255);
    --line: oklch(0.255 0.01 255);
    --line-2: oklch(0.33 0.012 255);
    --fg: oklch(0.92 0.006 85);
    --fg-2: oklch(0.72 0.008 85);
    --fg-3: oklch(0.56 0.008 85);
    --fg-4: oklch(0.43 0.008 255);
    --needs: oklch(0.78 0.13 70);
    --needs-bg: oklch(0.235 0.03 65);
    --state-working: oklch(0.75 0.1 200);
    --state-working-bg: oklch(0.25 0.03 200);
    --state-stale: oklch(0.66 0.05 280);
    --state-stale-bg: oklch(0.24 0.02 280);
    --ok: oklch(0.7 0.1 150);
    --err: oklch(0.7 0.14 25);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
  #host { position: absolute; inset: 0; }
  #log {
    position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
    font: 11px/1 var(--font-mono); color: var(--fg-3); pointer-events: none; z-index: 10;
  }
  #log:empty { display: none; }
</style>
<link rel="stylesheet" href="dist/harness.css">
</head>
<body>
<div id="host"></div>
<div id="log"></div>
<script type="module" src="dist/harness.js"></script>
</body>
</html>
